<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOX — Autonomous Voice Agent</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#070a12;--glass:rgba(255,255,255,.045);--brd:rgba(255,255,255,.09);--acc:#22d3ee;--acc2:#a78bfa;--ok:#34d399;--warn:#fbbf24;--bad:#fb7185}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Space Grotesk',sans-serif;color:#e6edf7;background:var(--bg);min-height:100vh;overflow-x:hidden}
  .mono{font-family:'JetBrains Mono',monospace}
  .glass{background:var(--glass);border:1px solid var(--brd);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .glow{box-shadow:0 0 40px -12px rgba(34,211,238,.5)}
  .lbl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#7c8aa5}
  .bar{transform-origin:bottom;transition:transform .05s linear}
  .dot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 10px currentColor}
  .pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.5)}}
  .tick{animation:tick .5s ease}
  @keyframes tick{from{transform:translateY(-6px);opacity:0}to{transform:translateY(0);opacity:1}}
  .btn{transition:transform .15s,box-shadow .15s,background .2s}
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(0)}
  .grid-bg{background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:34px 34px}
  .scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
</style>
</head>
<body class="grid-bg">
<div class="max-w-6xl mx-auto p-4 md:p-6 space-y-4">

  <!-- Header -->
  <header class="glass rounded-2xl px-5 py-4 flex flex-wrap items-center gap-4 justify-between">
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 rounded-xl grid place-items-center glow" style="background:linear-gradient(135deg,#22d3ee,#a78bfa)">
        <i class="fa-solid fa-wave-square text-slate-900 text-lg"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold leading-none tracking-tight">VOX<span class="text-cyan-400">.</span></h1>
        <p class="lbl mt-1">Autonomous Voice Agent · v2.4</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2 px-3 py-2 rounded-lg glass">
        <span id="statusDot" class="dot" style="color:#64748b;background:#64748b"></span>
        <span id="statusTxt" class="mono text-sm">IDLE</span>
      </div>
      <button id="toggle" class="btn px-5 py-2.5 rounded-xl font-semibold text-sm glow" style="background:linear-gradient(135deg,#22d3ee,#a78bfa);color:#04121a">
        <i class="fa-solid fa-power-off mr-2"></i>Start Agent
      </button>
</body>
</html>
