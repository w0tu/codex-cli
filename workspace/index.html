<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RaftKV — Distributed Key-Value Store</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  body{font-family:ui-sans-serif,system-ui,sans-serif}
  .glass{background:rgba(255,255,255,.04);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08)}
  .glow{box-shadow:0 0 24px -6px rgba(56,189,248,.5)}
  .pulse{animation:p 1.6s ease-in-out infinite}
  @keyframes p{50%{opacity:.35}}
  ::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
</style>
</head>
<body class="min-h-screen bg-[#070b14] text-slate-200">
<div class="fixed inset-0 -z-10 bg-[radial-gradient(60%_50%_at_50%_0%,rgba(56,189,248,.12),transparent),radial-gradient(40%_40%_at_80%_100%,rgba(168,85,247,.10),transparent)]"></div>

<div class="max-w-6xl mx-auto p-4 md:p-6 space-y-4">
  <header class="glass rounded-2xl p-4 flex flex-wrap items-center gap-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-400 to-fuchsia-500 grid place-items-center glow"><i class="fa-solid fa-cubes text-white"></i></div>
      <div><h1 class="text-lg font-bold tracking-tight">RaftKV</h1><p class="text-xs text-slate-400">Distributed KV · Raft Consensus</p></div>
    </div>
    <div class="ml-auto flex flex-wrap gap-2 text-xs">
      <span id="term" class="glass rounded-lg px-3 py-1.5"><i class="fa-solid fa-layer-group text-sky-400 mr-1"></i>Term <b class="text-white">1</b></span>
      <span id="state" class="glass rounded-lg px-3 py-1.5"><i class="fa-solid fa-heart-pulse text-emerald-400 mr-1"></i>Leader</span>
      <span id="log" class="glass rounded-lg px-3 py-1.5"><i class="fa-solid fa-database text-fuchsia-400 mr-1"></i>Log <b class="text-white">0</b></span>
    </div>
  </header>

  <div class="grid lg:grid-cols-3 gap-4">
    <section class="glass rounded-2xl p-4 lg:col-span-2">
      <h2 class="text-sm font-semibold mb-3 flex items-center gap-2"><i class="fa-solid fa-server text-sky-400"></i>Cluster Nodes</h2>
      <div id="nodes" class="grid sm:grid-cols-2 gap-3"></div>
    </section>

    <section class="glass rounded-2xl p-4 flex flex-col">
      <h2 class="text-sm font-semibold mb-3 flex items-center gap-2"><i class="fa-solid fa-pen-to-square text-fuchsia-400"></i>Write / Read</h2>
      <div class="flex gap-2 mb-2"><input id="k" placeholder="key" class="flex-1 bg-black/30 rounded-lg px-3 py-2 text-sm outline-none focus:ring-1 ring-sky-500"></div>
      <div class="flex gap-2 mb-3"><input id="v" placeholder="value" class="flex-1 bg-black/30 rounded-lg px-3 py-2 text-sm outline-none focus:ring-1 ring-sky-500"></div>
      <div class="flex gap-2 mb-3">
        <button onclick="set()" class="flex-1 bg-sky-500 hover:bg-sky-400 text-white rounded-lg py-2 text-sm font-medium"><i class="fa-solid fa-plus mr-1"></i>Set</button>
        <button onclick="get()" class="flex-1 bg-white/10 hover:bg-white/20 rounded-lg py-2 text-sm font-medium"><i class="fa-solid fa-magnifying-glass mr-1"></i>Get</button>
</body>
</html>
