<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stopwatch</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  .glass{background:rgba(255,255,255,.06);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.12)}
  .glow{box-shadow:0 0 60px rgba(56,189,248,.25),0 0 120px rgba(168,85,247,.15)}
  .num{font-variant-numeric:tabular-nums}
</style>
</head>
<body class="min-h-screen bg-[#07070c] text-white flex items-center justify-center p-6 overflow-hidden relative">
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-sky-500/20 rounded-full blur-[120px]"></div>
  <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-fuchsia-500/20 rounded-full blur-[120px]"></div>

  <div class="glass glow rounded-[2rem] p-10 w-full max-w-sm text-center relative">
    <p class="text-xs tracking-[0.4em] text-white/40 mb-6 uppercase">Stopwatch</p>
    <div class="num text-6xl font-light mb-10">
      <span id="min">00</span><span class="text-white/30">:</span><span id="sec">00</span><span class="text-white/30">.</span><span id="ms" class="text-3xl text-white/60">00</span>
    </div>
    <div class="flex gap-4 justify-center">
      <button id="start" class="flex-1 py-3 rounded-xl bg-sky-500 hover:bg-sky-400 transition active:scale-95 font-medium">
        <i class="fa-solid fa-play mr-2"></i>Start
      </button>
      <button id="reset" class="flex-1 py-3 rounded-xl bg-white/10 hover:bg-white/20 transition active:scale-95 font-medium">
        <i class="fa-solid fa-rotate-left mr-2"></i>Reset
      </button>
    </div>
  </div>

<script>
  let t=0,raf=null,last=0,running=false;
  const min=document.getElementById('min'),sec=document.getElementById('sec'),ms=document.getElementById('ms');
  const start=document.getElementById('start'),reset=document.getElementById('reset');
  const pad=n=>String(n).padStart(2,'0');
  function render(){
    const m=Math.floor(t/60000),s=Math.floor(t/1000)%60,x=Math.floor(t/10)%100;
    min.textContent=pad(m);sec.textContent=pad(s);ms.textContent=pad(x);
  }
  function loop(now){
    t+=now-last;last=now;render();raf=requestAnimationFrame(loop);
  }
  start.onclick=()=>{
    running=!running;
    if(running){last=performance.now();raf=requestAnimationFrame(loop);
      start.innerHTML='<i class="fa-solid fa-stop mr-2"></i>Stop';start.classList.replace('bg-sky-500','bg-rose-500');start.classList.replace('hover:bg-sky-400','hover:bg-rose-400');
    }else{cancelAnimationFrame(raf);
      start.innerHTML='<i class="fa-solid fa-play mr-2"></i>Start';start.classList.replace('bg-rose-500','bg-sky-500');start.classList.replace('hover:bg-rose-400','hover:bg-sky-400');
    }
  };
  reset.onclick=()=>{running=false;cancelAnimationFrame(raf);t=0;render();
    start.innerHTML='<i class="fa-solid fa-play mr-2"></i>Start';start.classList.replace('bg-rose-500','bg-sky-500');start.classList.replace('hover:bg-rose-400','hover:bg-sky-400');};
  render();
</script>
</body>
</html>
