[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-cli"
version = "1.5.0"
description = "The Codex Project — Autonomous AI terminal for Linux"
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0.0",
    "groq>=0.4.0",
    "prompt_toolkit>=3.0.0",
]

[project.scripts]
cdx = "codex.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["codex*"]
